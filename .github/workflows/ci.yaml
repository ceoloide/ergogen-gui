name: CI

on:
  pull_request:
    branches: ['main']

# Pull request validation only needs to read the repository. Declaring this
# explicitly avoids inheriting a write-scoped repository default token.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install validation tools
        run: |
          pnpm tools:install
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"
      - name: Install locked dependencies
        run: PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS=false pnpm install --frozen-lockfile
      - name: Validate
        run: pnpm validate
        env:
          VITE_GTAG_ID: ${{ vars.REACT_APP_GTAG_ID || vars.VITE_GTAG_ID }}
          VITE_PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance
        run: pnpm test:e2e
      - name: Upload validation reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validation-${{ github.sha }}
          path: |
            reports/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
